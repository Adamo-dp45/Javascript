<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <div id="slideshow">
        <img src="1.jpg" alt="">
        <img src="2.jpg" alt="">
        <img src="3.jpg" alt="">
        <img src="4.jpg" alt="">
    </div>

    <script id="vertexShader" type="x-shader/x-vertex">
        precision mediump float;

        attribute vec3 aVertexPosition;
        attribute vec2 aTextureCoord;

        uniform mat4 uMVMatrix;
        uniform mat4 uPMatrix;

        uniform mat4 uActiveTextureMatrix;
        uniform mat4 uNextTextureMatrix;

        varying vec3 vVertexPosition;
        varying vec2 vActiveTextureCoord;
        varying vec2 vNextTextureCoord;

        void main () {
            gl_Position = uPMatrix * uMVMatrix * vec4(aVertexPosition, 1.0);
            vVertexPosition = aVertexPosition;
            vActiveTextureCoord = (uActiveTextureMatrix * vec4(aTextureCoord, 0.0, 1.0)).xy;
            vNextTextureCoord = (uNextTextureMatrix * vec4(aTextureCoord, 0.0, 1.0)).xy;
        }
    </script>
    <script id="fragmentShader" type="x-shader/x-fragment">
        precision mediump float;

        varying vec3 vVertexPosition;
        varying vec2 vActiveTextureCoord;
        varying vec2 vNextTextureCoord;

        uniform sampler2D uActiveTexture;
        uniform sampler2D uNextTexture;
        uniform float uTime;
        uniform float uProgress;
        uniform float uDirection;
        uniform vec2 uResolution;

        float square(vec2 p, float size) {
            size = 1.0 - size;
            vec2 bl = step(size * 0.5, p);
            vec2 tr = step(size * 0.5, 1.0 - p);
            return bl.x * bl.y * tr.x * tr.y;
        }

        void main () {
            vec2 position = vVertexPosition.xy * 0.5 + 0.5;
            vec2 normalizedResolution = normalize(uResolution);
            position = position * normalizedResolution;
            position += (1.0 - normalizedResolution) * 0.5;

            // float progress = sin(uTime * 0.002) * 0.5 + 0.5;
            float progress = uProgress;

            // float alpha = square(position, progress);
            vec2 center = vec2(1.0) - vec2(0.5) + normalizedResolution * 0.5;
            center += normalizedResolution * (uDirection * 0.5 - 0.5);
            float gradient = 1.0 - distance(position, center) + (progress * 2.0 - 1.0);
            gradient = smoothstep(0.1, 0.9, gradient);

            position = fract(position * 20.0);
            float alpha = square(position, gradient);

            vec4 activeColor = texture2D(uActiveTexture, vActiveTextureCoord);
            vec2 nextTextureCoord = vNextTextureCoord;
            nextTextureCoord -= (1.0 - gradient) * 0.05 * uDirection;
            vec4 nextColor = texture2D(uNextTexture, nextTextureCoord);

            gl_FragColor = mix(activeColor, nextColor, alpha);
            // gl_FragColor = vec4(vec3(gradient), 1.0);
            // gl_FragColor = vec4(position, 0.0, 1.0);
        }
    </script>
    <script type="module" src="../build/curtainsjs.js" defer></script>
</body>
</html>
