<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Décompte</title>
    <link rel="stylesheet" href="./css/style.css">
    <script src="./js/countdown.js" defer></script>
</head>
<body>
	<div class="wrap">
		<div class="logo">
			<img src="img/logo.png" alt="" />
		</div>
		<div class="content">
			<h1>Coming soon</h1>
			<p>Vestibulum blandit <strong>facilisis</strong> fermentum. Nunc eget lacus quam, eget bibendum justo. Sed at arcu a leo <em>interdum</em> accumsan.</p>

			<div class="numbers" id="countdown" data-time="2025-09-25T16:56:22+0000">
				<div class="bloc">
					<strong id="days"></strong>
					<em>Jours</em>
				</div>
				<div class="bloc">
					<strong id="hours"></strong>
					<em>Heures</em>
				</div>
				<div class="bloc">
					<strong id="minutes"></strong>
					<em>Minutes</em>
				</div>
				<div class="bloc last">
					<strong id="seconds"></strong>
					<em>Secondes</em>
				</div>
			</div>

			<time-countdown time="17844545545"></time-countdown>
		</div>
		<div class="footer">
		</div>
	</div>
</body>
</html>
