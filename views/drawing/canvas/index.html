<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Canvas</title>
    <script src="./canvas.js" defer></script>
</head>
<style>
    canvas {
        border: 1px dotted #CCC;
    }

    section {
        display: flex;
    }

    #palette div, #outils div {
        width: 100px;
        height: 100px;
        border: 1px dotted #CCC;
        font-size: 3rem;
        display: flex;
        justify-content: center;
        align-items: center;
    }
</style>
<body>
    <section style="margin-bottom: 30px;">
        <canvas id="feuille" width="400" height="400"></canvas>
        <div id="palette">
            <div data-color="blue"></div>
            <div data-color="yellow"></div>
            <div data-color="red"></div>
            <div data-color="#CCC"></div>
        </div>
        <div id="outils">
            <div id="plus">+</div>
            <div id="moins">-</div>
            <div id="gomme">g</div>
            <div id="croix">x</div>
        </div>
    </section>

    <section style="margin-bottom: 30px;">
        <canvas id="signature" height="400" width="400"></canvas>
        <a href="" id="effacer">Effacer</a>
        <a href="" id="enregistrer">Enregistrer</a>
    </section>

    <canvas id="canvas" height="450" width="450">
        Votre navigateur ne supporte pas la balise canvas
    </canvas>

    <!--
        Par défaut fais 300/150 - Le texte à l'intérieur n'apparaît que si le navigateur ne le supporte pas
    -->
</body>
</html>
