<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulaire multiple</title>
    <script src="../src/js/form.js" defer></script>
</head>
<style>
    * {
        font-family: "Poppins", sans-serif;
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(45deg, #0d2567, #4070f4);
    }

    .form {
        width: 400px;
        background: #fff;
        padding: 30px 20px;
        border-radius: 10px;
    }

    .form .title {
        text-align: center;
        text-transform: uppercase;
        font-size: 22px;
        letter-spacing: 1px;
    }

    .progress-steps {
        position: relative;
        display: flex;
        justify-content: space-between;
        margin: 30px 20px 60px;
        counter-reset: step;
    }

    .progress-steps::before,
    .progress {
        position: absolute;
        content: "";
        height: 4px;
        width: 100%;
        background: #dcdcdc;
        top: 50%;
        transform: translateY(-50%);
    }

    .progress-steps .progress-step {
        width: 30px;
        height: 30px;
        background: #dcdcdc;
        color: #222;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 2;
        transition: 0.1s;
    }

    .progress-steps .progress-step.step-active {
        background: #4070f4;
        color: #fff;
        transition-delay: 0.2s;
    }

    .progress-steps .progress-step::before {
        content: counter(step);
        counter-increment: step;
    }

    .progress-steps .progress-step span {
        position: absolute;
        top: calc(100% + 5px);
        font-size: 10px;
        text-wrap: nowrap;
        color: #999;
    }

    .progress {
        background: #4070f4;
        width: 0%;
        transition: 0.3s;
    }

    .form-step {
        display: none;
        transform-origin: top;
        animation: animate 0.5s;
    }

    @keyframes animate {
        from {
            transform: scale(1, 0);
            opacity: 0;
        }
        to {
            transform: scale(1, 1);
            opacity: 1;
        }
    }

    .form-step.form-active {
        display: block;
    }

    .form-step .input-box {
        margin: 20px 0;
    }

    .form-step .input-box label {
        display: block;
        font-size: 15px;
        margin-bottom: 5px;
    }

    .form-step .input-box input {
        display: block;
        width: 100%;
        padding: 10px;
        outline: none;
        border: 1px solid #dcdcdc;
        border-radius: 5px;
    }

    .btn-box {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 20px;
        margin-top: 40px;
    }

    .btn-box .btn {
        text-decoration: none;
        display: block;
        background: #4070f4;
        color: #fff;
        text-align: center;
        padding: 10px;
        border-radius: 5px;
        border: none;
        outline: none;
        cursor: pointer;
        transition: 0.3s;
    }

    .btn-box .btn:hover {
        background: #0d2567;
    }

    .btn-box1 {
        display: block;
    }

    .btn1 {
        margin-left: auto;
        width: 50%;
    }
</style>
<body>

    <form action="" class="form">
        <h2 class="title">Create Account</h2>

        <div class="progress-steps">
            <div class="progress-step step-active"><span>Basic Info</span></div>
            <div class="progress-step"><span>Contact Info</span></div>
            <div class="progress-step"><span>Password</span></div>
            <div class="progress"></div>
        </div>

        <div class="form-step form-active">
            <div class="input-box">
                <label for="">First Name</label>
                <input type="text" placeholder="First name" />
            </div>
            <div class="input-box">
                <label for="">Last Name</label>
                <input type="text" placeholder="Last name" />
            </div>
            <div class="btn-box btn-box1">
                <a href="#" class="btn next-btn btn1">Next</a>
            </div>
        </div>

        <div class="form-step">
            <div class="input-box">
                <label for="">Phone Number</label>
                <input type="tel" placeholder="Phone number" />
            </div>
            <div class="input-box">
                <label for="">Email Address</label>
                <input type="email" placeholder="Email address" />
            </div>
            <div class="btn-box">
                <a href="#" class="btn prev-btn">Previous</a>
                <a href="#" class="btn next-btn">Next</a>
            </div>
        </div>

        <div class="form-step">
            <div class="input-box">
                <label for="">Password</label>
                <input type="password" placeholder="Create password" />
            </div>
            <div class="input-box">
                <label for="">Confirm Password</label>
                <input type="password" placeholder="Confirm password" />
            </div>
            <div class="btn-box">
                <a href="#" class="btn prev-btn">Previous</a>
                <button class="btn" type="submit">Submit</button>
            </div>
        </div>
    </form>

</body>
</html>
